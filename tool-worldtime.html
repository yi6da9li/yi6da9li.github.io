<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界时间 · 航运派 Trans Pi</title>
  <link rel="stylesheet" href="tool.css?v=transpi-tools-20261001" />
</head>
<body>
  <div class="tool-page">
    <a class="tool-back" href="index.html">← 返回 航运派 Trans Pi</a>
    <h1 class="tool-h1">世界时间</h1>
    <p class="tool-sub">核心航运城市实时本地时间对照，跨时区沟通、约会议、算截关不再算错点。每秒自动刷新。</p>
    <div class="clock-grid" id="clocks"></div>
  </div>

  <script>
    var cities = [
      { name: '上海', tz: 'Asia/Shanghai' },
      { name: '香港', tz: 'Asia/Hong_Kong' },
      { name: '新加坡', tz: 'Asia/Singapore' },
      { name: '迪拜', tz: 'Asia/Dubai' },
      { name: '鹿特丹', tz: 'Europe/Amsterdam' },
      { name: '汉堡', tz: 'Europe/Berlin' },
      { name: '伦敦', tz: 'Europe/London' },
      { name: '洛杉矶', tz: 'America/Los_Angeles' },
      { name: '纽约', tz: 'America/New_York' },
      { name: '休斯顿', tz: 'America/Chicago' },
      { name: '桑托斯', tz: 'America/Sao_Paulo' },
      { name: '赫尔辛基', tz: 'Europe/Helsinki' },
      { name: '釜山', tz: 'Asia/Seoul' },
      { name: '胡志明', tz: 'Asia/Ho_Chi_Minh' },
      { name: '圣彼得堡', tz: 'Europe/Moscow' }
    ];
    var wrap = document.getElementById('clocks');
    cities.forEach(function (c, i) {
      var card = document.createElement('div');
      card.className = 'clock-card';
      card.innerHTML = '<div class="city">' + c.name + '</div>' +
        '<div class="time" id="t' + i + '">--:--:--</div>' +
        '<div class="date" id="d' + i + '">--</div>';
      wrap.appendChild(card);
    });
    function tick() {
      var now = new Date();
      cities.forEach(function (c, i) {
        var time = new Intl.DateTimeFormat('zh-CN', {
          timeZone: c.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).format(now);
        var date = new Intl.DateTimeFormat('zh-CN', {
          timeZone: c.tz, month: '2-digit', day: '2-digit', weekday: 'short'
        }).format(now);
        document.getElementById('t' + i).textContent = time;
        document.getElementById('d' + i).textContent = date;
      });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
