<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界时间 · 航运派 Trans Pi</title>
  <link rel="stylesheet" href="tool.css?v=worldtime-chi-20261020" />
</head>
<body>
  <div class="tool-page">
    <a class="tool-back" href="index.html">← 返回 航运派 Trans Pi</a>
    <h1 class="tool-h1">世界时间</h1>
    <p class="tool-sub">核心航运城市实时本地时间对照，跨时区沟通、约会议、算截关不再算错点。每秒自动刷新。按大洲分组，同大洲依英文名首字母排列。</p>
    <div id="clocks"></div>
  </div>

  <script>
    // 每个城市含中文名 name、英文名 en（用于同大洲内按字母排序）、IANA 时区 tz
    var citiesRaw = [
      { name: '上海', en: 'Shanghai', tz: 'Asia/Shanghai' },
      { name: '香港', en: 'Hong Kong', tz: 'Asia/Hong_Kong' },
      { name: '新加坡', en: 'Singapore', tz: 'Asia/Singapore' },
      { name: '迪拜', en: 'Dubai', tz: 'Asia/Dubai' },
      { name: '吉布提', en: 'Djibouti', tz: 'Africa/Djibouti' },
      { name: '阿比让', en: 'Abidjan', tz: 'Africa/Abidjan' },
      { name: '阿尔及尔', en: 'Algiers', tz: 'Africa/Algiers' },
      { name: '开普敦', en: 'Cape Town', tz: 'Africa/Johannesburg' },
      { name: '达累斯萨拉姆', en: 'Dar es Salaam', tz: 'Africa/Dar_es_Salaam' },
      { name: '德班', en: 'Durban', tz: 'Africa/Johannesburg' },
      { name: '拉各斯', en: 'Lagos', tz: 'Africa/Lagos' },
      { name: '蒙巴萨', en: 'Mombasa', tz: 'Africa/Nairobi' },
      { name: '塞得港', en: 'Port Said', tz: 'Africa/Cairo' },
      { name: '卡拉奇', en: 'Karachi', tz: 'Asia/Karachi' },
      { name: '新德里', en: 'New Delhi', tz: 'Asia/Kolkata' },
      { name: '东京', en: 'Tokyo', tz: 'Asia/Tokyo' },
      { name: '吉隆坡', en: 'Kuala Lumpur', tz: 'Asia/Kuala_Lumpur' },
      { name: '雅加达', en: 'Jakarta', tz: 'Asia/Jakarta' },
      { name: '安特卫普港', en: 'Antwerp', tz: 'Europe/Brussels' },
      { name: '热那亚港', en: 'Genoa', tz: 'Europe/Rome' },
      { name: '勒阿弗尔港', en: 'Le Havre', tz: 'Europe/Paris' },
      { name: '泽布吕赫港', en: 'Zeebrugge', tz: 'Europe/Brussels' },
      { name: '鹿特丹', en: 'Rotterdam', tz: 'Europe/Amsterdam' },
      { name: '汉堡', en: 'Hamburg', tz: 'Europe/Berlin' },
      { name: '伦敦', en: 'London', tz: 'Europe/London' },
      { name: '洛杉矶', en: 'Los Angeles', tz: 'America/Los_Angeles' },
      { name: '纽约', en: 'New York', tz: 'America/New_York' },
      { name: '芝加哥', en: 'Chicago', tz: 'America/Chicago' },
      { name: '休斯顿', en: 'Houston', tz: 'America/Chicago' },
      { name: '多伦多', en: 'Toronto', tz: 'America/Toronto' },
      { name: '桑托斯', en: 'Santos', tz: 'America/Sao_Paulo' },
      { name: '布宜诺斯艾利斯港', en: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires' },
      { name: '巴尔博亚港', en: 'Balboa', tz: 'America/Panama' },
      { name: '瓦尔帕莱索港', en: 'Valparaiso', tz: 'America/Santiago' },
      { name: '赫尔辛基', en: 'Helsinki', tz: 'Europe/Helsinki' },
      { name: '釜山', en: 'Busan', tz: 'Asia/Seoul' },
      { name: '胡志明', en: 'Ho Chi Minh City', tz: 'Asia/Ho_Chi_Minh' },
      { name: '圣彼得堡', en: 'Saint Petersburg', tz: 'Europe/Moscow' }
    ];

    // 大洲显示顺序（东半球 → 西半球）：亚洲 → 欧洲 → 非洲 → 美洲
    var continentOrder = ['Asia', 'Europe', 'Africa', 'America'];
    var continentNames = { Asia: '亚洲', Europe: '欧洲', Africa: '非洲', America: '美洲' };

    // 按大洲分组，同大洲内按英文名首字母排序
    var groups = {};
    citiesRaw.forEach(function (c) {
      var cont = c.tz.split('/')[0];
      (groups[cont] = groups[cont] || []).push(c);
    });
    Object.keys(groups).forEach(function (k) {
      groups[k].sort(function (a, b) { return a.en.localeCompare(b.en); });
    });

    var wrap = document.getElementById('clocks');
    var cities = []; // 扁平数组，供 tick() 逐张更新时间
    var idx = 0;

    continentOrder.forEach(function (cont) {
      if (!groups[cont] || !groups[cont].length) return;
      var head = document.createElement('h2');
      head.className = 'continent-head';
      head.textContent = continentNames[cont];
      wrap.appendChild(head);

      var grid = document.createElement('div');
      grid.className = 'clock-grid';
      wrap.appendChild(grid);

      groups[cont].forEach(function (c) {
        var i = idx++;
        cities.push(c);
        var card = document.createElement('div');
        card.className = 'clock-card';
        card.innerHTML = '<div class="city">' + c.name + '</div>' +
          '<div class="city-en">' + c.en + '</div>' +
          '<div class="time" id="t' + i + '">--:--:--</div>' +
          '<div class="date" id="d' + i + '">--</div>';
        grid.appendChild(card);
      });
    });

    function tick() {
      var now = new Date();
      cities.forEach(function (c, i) {
        var time = new Intl.DateTimeFormat('zh-CN', {
          timeZone: c.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).format(now);
        var date = new Intl.DateTimeFormat('zh-CN', {
          timeZone: c.tz, month: '2-digit', day: '2-digit', weekday: 'short'
        }).format(now);
        document.getElementById('t' + i).textContent = time;
        document.getElementById('d' + i).textContent = date;
      });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
