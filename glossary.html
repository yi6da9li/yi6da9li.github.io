  {"en":"Cost, Assurance and Freight (CAF)","zh":"成本保险费运费（旧称CAF）","def":"成本保险费加运费（旧称，现多作CIF）"},
  {"en":"Cost, Insurance and Freight (CIF)","zh":"成本保险费运费（CIF）","def":"成本保险费加运费；卖方包到目的港"},
  {"en":"Cross Trade (CT)","zh":"三角贸易（交叉贸易）","def":"第三国贸易；起讫均非本国的运输"},
  {"en":"Cross-border E-Commerce","zh":"跨境电商","def":"跨境电商；跨国网络零售"},
  {"en":"Cross-Docking","zh":"越库（交叉转运）","def":"越库作业；不入库直接转装"},
  {"en":"Cubic Metre (CBM)","zh":"立方米（CBM）","def":"立方米；体积计量单位"},
  {"en":"Currency Adjustment Factor (CAF)","zh":"货币贬值附加费（CAF）","def":"这是一种补偿性的费用分摊措施，可以帮助承运商消除与汇率波动相关的风险。请单击此处以了解 CAF 计算概要。这项费用适用于这些贸易航线上的所有订舱单。它主要适用于（但不限于）欧洲贸易航线，如：欧洲 - 远东、欧洲 - 中东/红海/印度次大陆、美国往返欧洲"},
  {"en":"Customer","zh":"客户","def":"客户；购买或接收服务方"},
  {"en":"Customer Satisfaction Survey (CSS)","zh":"客户满意度调查","def":"客户满意度调查"},
  {"en":"Customs clearance","zh":"清关","def":"清关；办理海关放行手续"},
  {"en":"Customs Entries","zh":"海关申报","def":"报关单；向海关申报的单证"},
  {"en":"Customs House Broker","zh":"报关行","def":"报关行；代理报关的企业"},
  {"en":"Customs Trade Partnership Against Terrorist (CTPAT)","zh":"海关-商贸反恐联盟","def":"海关反恐贸易伙伴；美海关安保计划"},
  {"en":"Cut-Off Time","zh":"截关时间（截止时间）","def":"截关时间；停止收货/装船时限"},
  {"en":"Cycle Count","zh":"循环盘点","def":"循环盘点；轮动清点库存"},
  {"en":"Cycle Time","zh":"周期时间","def":"周期时间；完成一流程耗时"},
  {"en":"Dangerous Cargo Service","zh":"危险货物服务","def":"这项费用包括承运商在运输危险货物至内陆或从内陆运输危险货物时产生的额外费用。 额外费用包括授权费、许可费，以及承运商使用拥有更多认证的特殊供应商（费用更高）时产生的额外费用。 这项费用适用于客户要求承运商采用内陆运输（出口或进口）的危险货物订舱。"},
  {"en":"Dangerous Goods (DG)","zh":"危险货物（DG）","def":"危险品；运输中具危险性的货物"},
  {"en":"Dangerous Goods Declaration (DGD)","zh":"危险品申报单","def":"危险品申报单；危险货物申报文件"},
  {"en":"Days Payable Outstanding (DPO)","zh":"应付账款周转天数","def":"应付账款周转天数"},
  {"en":"Days Sales Outstanding (DSO)","zh":"应收账款周转天数","def":"应收账款周转天数"},
  {"en":"Delivered Ex Ship (DES)","zh":"目的港船上交货（DES）","def":"如需更多信息，请参阅 &gt;www.iccwbo.org"},
  {"en":"Delivered-at-place (DAP)","zh":"目的地交货（DAP）","def":"目的地交货；卖方运至约定地点"},
  {"en":"Delivery","zh":"交付","def":"从发货人到承运商以及从承运商/运输代理到收货人的货物实际转让和法定转让。 (2) 使另一人合法占有财产的行为，涉及将该财产的控制权从一人实际转让至另一人，或以其他各种方式受到有益影响。"},
  {"en":"Delivery Duty Paid (DDP)","zh":"完税后交货（DDP）","def":"完税后交货；卖方包税送到"},
  {"en":"Delivery Duty Unpaid (DDU)","zh":"未完税交货（DDU）","def":"如需了解更多信息，请参阅 &gt;www.iccwbo.org"},
  {"en":"Delivery Ex Quay (DEQ)","zh":"目的港码头交货（DEQ）","def":"如需了解更多信息，请参阅 &gt;www.iccwbo.org"},
  {"en":"Delivery Order","zh":"提货单（D/O）","def":"收货人、托运人或货主要求码头营运商、承运商或仓库将货物运送给另一方的订单。在进口时，也称港口放行通知单。 既非提单也非货运单的文件，但包含以下： (1) 按照合同提供或考虑到合同的目的而提供，该合同是为此文件所涉及货物的海上运输或包含这些货物之货物的海上运输所订立； (2) 是承运商对文件中所确认人员的承诺，即保证会将这些货物交付给此文件涉及的人员。 交货单可以通过背书转让合同权利，但从能够通过推定占有的意义上来说，交货单并非必需文件。"},
  {"en":"Demand Chain","zh":"需求链","def":"供应链的别名，更强调客户或控制需求的一方。"},
  {"en":"Demurrage","zh":"滞期费","def":"当客户在码头占用承运商设备的天数超过预定的免费天数时，将产生这笔费用。 这项费用在出口（提前退箱）和进口（延迟收箱）时都可能产生。 出口：滞留天数等于入港日（含当日）到装箱日的总天数减去免费天数。 进口：滞留天数等于卸货日到离港日（含当日）的总天数减去免费天数。 将对在码头停留的时间超过预定免费天数的所有集装箱收取该项费用。"},
  {"en":"Depth","zh":"深度","def":"型深；船体甲板到龙骨深度"},
  {"en":"Destination Interchange Terminal (DIT)","zh":"目的地交换站","def":"目的地交接站；终点交接场站"},
  {"en":"Detention","zh":"滞箱费","def":"滞箱费；超期占用集装箱费用"},
  {"en":"Detention Fee - Export","zh":"出口滞箱费","def":"当客户占用承运商设备的天数超过预定的免费天数时，将产生这笔费用。 出口：滞期天数等于从提取空箱到入港日（含当日）的总天数减去免费天数。 需对客户所占有天数超过预定免费天数的所有集装箱收取该项费用。 不对托运人拥有的集装箱收取该费用。 *适用计算方法可能因国家而异。"},
  {"en":"Detention Fee - Import","zh":"进口滞箱费","def":"当客户占用承运商设备的天数超过预定的免费天数时，将产生这笔费用。 进口：滞期天数等于从离港日（含当日）到入港日（不含当日）的总天数减去免费天数。* 需对客户所占有天数超过预定免费天数的所有集装箱收取该项费用。 *适用计算方法可能因国家而异。"},
  {"en":"Detention in Transit Service","zh":"在途滞箱服务","def":"承运商有权在转运港口暂停货物运输，直至收到客户的进一步指示。 这样客户可以灵活地延迟货物抵达期，有助于其开展业务。 注：除非客户提交书面声明，保证对于在额外的延期期间（不在保险范围内）造成的任何货物损坏，承运人将不承担任何赔偿，否则承运商不得将集装箱滞留超过 14 天。 应客户要求，并经承运商接受后，将收取 DIT 费用。"},
  {"en":"Devanning","zh":"拆箱（掏箱）","def":"拆箱；从集装箱卸出货物"},
  {"en":"Differential","zh":"差额","def":"在基本费率的基础上增加或扣除的金额即是往返另一地点或采用另一条路线的费用。"},
  {"en":"Dimension","zh":"尺码","def":"尺寸；货物的长×宽×高"},
  {"en":"Direct to Consumer (D2C)","zh":"直达消费者","def":"直达消费者；厂直发终端客户"},
  {"en":"Discharge Port","zh":"卸货港","def":"卸货港；卸下货物的港口"},
  {"en":"Distribution","zh":"配送","def":"将产品从生产线移交给最终用户所需的所有活动和规划。"},
  {"en":"Distribution Center (DC)","zh":"配送中心","def":"配送中心；货物分拨枢纽"},
  {"en":"Distribution Requirements Planning","zh":"配送需求计划","def":"确定分销中心的库存需求和反向整合需求信息的系统，并且可作为生产和物料系统的一部分。"},
  {"en":"Distributor","zh":"分销商","def":"分销商；转售货物的中间商"},
  {"en":"Diversion Charge","zh":"改港费","def":"货物从原定目的港转移至新地点所需的费用。"},
  {"en":"Dock Receipt","zh":"码头收据","def":"为在码头或船坞收到或交付的货物开具的收据。完成外运时，需凭码头收据向运输公司换取提单。"},
  {"en":"Door-to-Door","zh":"门到门","def":"门到门；起运地到收货地全程"},
  {"en":"Double Stack Car","zh":"双层集装箱平车","def":"能够运载两个堆叠在彼此顶部的集装箱的轨道车。"},
  {"en":"Draft","zh":"吃水/汇票","def":"海运：船体在水面以下的深度。铁路：一对连挂车辆。金融：由一方签署以指示另一方向第三方支付特定金额的书面命令。也称汇票。"},
  {"en":"Drawback","zh":"退税（关税退还）","def":"对将再次出口的已进口或已缴纳关税的物资退还 99% 税费。"},
  {"en":"Drayage","zh":"短途拖运（拖驳）","def":"从厂商到装运港和从卸货港到剥离海运集装箱地点的内陆运输。此时需对 CY 和 CFS 货物进行短驳拖运。"},
  {"en":"Drop-shipping","zh":"代发货（直运）","def":"代发货；供应商直发终端客户"},
  {"en":"Dry Dock","zh":"干船坞","def":"用于停运船舶以进行修理。"},
  {"en":"Dunnage","zh":"垫料（隔垫料）","def":"用于货物四周以避免破损或变形的材料，通常由托运人提供。计费将涵盖其重量。"},
  {"en":"Duty","zh":"关税/义务","def":"关税；进口应纳税费"},
  {"en":"Duty Drawback","zh":"关税退还","def":"为再出口货物或贸易展览材料退回的款项。 (2) 再出口货物的关税退税。"},
  {"en":"E-Fulfilment","zh":"电子履约","def":"电子履约；电商订单履行"},
  {"en":"EAN 8","zh":"EAN-8条码","def":"当需要了解原产国时，必须使用 EAN 条形码。EAN 8 共有 8 位数，前两位数为原产国代码，中间五位数为数据，最后一位则为检查码。同样也支持 2 位数和 5 位数的增补。"},
  {"en":"Earnings","zh":"收益","def":"公司支付完税费和所有其他费用之后所得的收入。即利润或净收入。"},
  {"en":"Earnings Before Interest","zh":"息前收益","def":"息前收益；未扣利息的利润"},
  {"en":"Economic Order Quantity (EOQ)","zh":"经济订货量","def":"经济订货量；最优订货批量"},
  {"en":"Economic Value Added (EVA)","zh":"经济增加值","def":"经济增加值；扣除资本成本后的利润"},
  {"en":"Economy of Scale","zh":"规模经济","def":"规模经济；产量增大降本"},
  {"en":"Efficient Consumer Response (ECR)","zh":"高效消费者响应","def":"高效消费者响应；快消供应链协同"},
  {"en":"EIR","zh":"设备交接单（EIR）","def":"集装箱交接单。在任何码头或内陆集装箱堆放场/货场接收或发送满载或空载集装箱/底盘车的所用文件。"},
  {"en":"Electronic Data Interchange (EDI)","zh":"电子数据交换（EDI）","def":"电子数据交换；标准化报文传输"},
  {"en":"Electronic Funds Transfer (EFT)","zh":"电子资金转账","def":"电子资金转账；电子付款"},
  {"en":"Electronic Shipping Instruction (ESI)","zh":"电子装船指示","def":"电子装运指示；电子装船指令"},
  {"en":"Electronic Standard Operating Procedures (ESOP)","zh":"电子标准作业程序","def":"电子标准作业程序"},
  {"en":"Enterprise Resource Planning (ERP)","zh":"企业资源计划（ERP）","def":"企业资源计划；集成管理系统"},
  {"en":"Equalisation","zh":"均等化","def":"平衡费；区域价差平衡附加费"},
  {"en":"Equipment Interchange Receipt (EIR)","zh":"设备交接单","def":"设备交接单；箱管交接凭证"},
  {"en":"Error List (EL)","zh":"错误清单","def":"显示数据输入差异（错误）的报告。"},
  {"en":"Estimated Time of Arrival","zh":"预计到达时间（ETA）","def":"预计到达时间；ETA"},
  {"en":"Ex works (EXW)","zh":"工厂交货（EXW）","def":"工厂交货；卖方仅交出厂"},
  {"en":"Expected Receipt Date (ERD)","zh":"预计收货日期","def":"预计收货日；到货预期日期"},
  {"en":"Export Declaration","zh":"出口申报","def":"出口报关单；出口申报文件"},
  {"en":"Export License","zh":"出口许可证","def":"出口许可证；准许出口的证件"},
  {"en":"Exporter Identification Number (EIN)","zh":"出口商识别号","def":"出口商识别号；出口商编码"},
  {"en":"Express B/L","zh":"电放提单","def":"电放提单；凭电讯放货的提单"},
  {"en":"Extra Loader","zh":"加班船","def":"加班船；临时加开的船舶"},
  {"en":"Federal Maritime Commission (FMC)","zh":"美国联邦海事委员会","def":"美国联邦海事委员会；航运监管"},
  {"en":"Feeder (F)","zh":"支线船","def":"将货物从主线船舶运至最终目的地，或将货物从第一收货港传递至主线船舶的运输工具。"},
  {"en":"Feeder Ports","zh":"支线港","def":"支线港；喂给干线港的港口"},
  {"en":"Feeder Vessel","zh":"支线船","def":"支线船；集散中转小船"},
  {"en":"First In First Out (FIFO)","zh":"先进先出","def":"先进先出；先入库先出库"},
  {"en":"Flat Bed","zh":"平板车","def":"平板车；无栏板的拖车"},
  {"en":"Floating Cranes (FC)","zh":"浮吊","def":"在无法使用传统龙门起重机的情况下，可处理非常沉重的货物的重型起重机。"},
  {"en":"For-Hire Carriers (FHC)","zh":"营业承运人","def":"有偿运输货物或乘客的个人或企业。一般可分为两类：专业承运商和普通的汽车货运承运商。"},
  {"en":"Force Majeure","zh":"不可抗力","def":"不可抗力；无法预见免责任的事件"},
  {"en":"Forty Foot Equivalent Unit (FEU/FFE)","zh":"四十英尺等量单位","def":"40英尺箱当量；两TEU"},
  {"en":"Forwarders Cargo Receipt (FCR)","zh":"货运代理收货凭证","def":"货运代理收货凭证；货代签收货证"},
  {"en":"Free Along Side (FAS)","zh":"船边交货（FAS）","def":"船边交货；货交船边"},
  {"en":"Free Carrier (FCA)","zh":"货交承运人（FCA）","def":"货交承运人；货交约定地点承运"},
  {"en":"Free In/Liner Out (FILO)","zh":"船方不负担装／船方负担卸","def":"船方不负责装、负责卸"},
  {"en":"Free On Board (FOB)","zh":"船上交货（FOB）","def":"船上交货；货过船舷风险转移"},
  {"en":"Free Time","zh":"免费期（免费用箱期）","def":"免费期；免收滞箱/堆存期限"},
  {"en":"Free Trade Zone (FTZ)","zh":"自由贸易区","def":"自由贸易区；保税免税区域"},
  {"en":"Freight All Kinds (FAK)","zh":"均一费率（不分货种）","def":"均一运费；不分货类统一费率"},
  {"en":"Freight Bill (FB)","zh":"运费单","def":"目的地（到付）运费提单：预付运费提单。(1) 送至收货人的运输线所提供的账单，描述了货物托运人的名称、始发地和计重收费（如未预付）。(2) 送至托运人的运输线所提供的账单，当中描述了运费、收货人、目的地和计重收费。"},
  {"en":"Freight Cashier","zh":"运费出纳","def":"运费出纳；收取运费的岗位"},
  {"en":"Freight Forwarder (FF)","zh":"货运代理","def":"对不够整拖车的小宗货的装运和分配进行组装、收集和整合的人员。(2) 同时也指在货物运往国外或运进国内的过程中，承担代理人角色，通过联邦海关结算运费的人员。"},
  {"en":"Freight Release","zh":"放货（运费付清放货）","def":"放货；付清运费后放货"},
  {"en":"Fulfillment","zh":"订单履行（履约）","def":"履约；完成订单交付"},
  {"en":"Full Container Load (FCL)","zh":"整箱（FCL）","def":"整箱货；一箱一票货主"},
  {"en":"Full Visible Capacity","zh":"全部可见运力","def":"总可见运力；公开可订舱位"},
  {"en":"Gain Sharing","zh":"收益共享","def":"收益分享；节约分成机制"},
  {"en":"Gangway","zh":"舷梯（跳板）","def":"舷梯通道；上下船通道"},
  {"en":"Gantry Crane (G)","zh":"龙门吊","def":"龙门起重机 用于从船上装卸集装箱的港口起重机，可以沿着铁轨移动进行固定。"},
  {"en":"Garment-on-Hanger (GOH)","zh":"挂衣集装箱","def":"挂衣箱；服装悬挂运输"},
  {"en":"Gate-In","zh":"进闸（进场）","def":"进闸；集装箱进港区"},
  {"en":"Gate-Out","zh":"出闸（出场）","def":"出闸；集装箱出港区"},
  {"en":"General Average","zh":"共同海损","def":"共同海损；共同安全牺牲的分摊"},
  {"en":"General Rate Increase (GRI)","zh":"综合费率上涨（GRI）","def":"综合费率上涨；班轮普涨"},
  {"en":"Generalized System of Preference (GSP)","zh":"普遍优惠制","def":"普惠制；发达国家给予关税优惠"},
  {"en":"Genset","zh":"冷藏箱发电机组","def":"发电机组的；箱用柴油发电机"},
  {"en":"Globalization","zh":"全球化","def":"全球化；生产贸易跨国整合"},
  {"en":"Green Supply Chain","zh":"绿色供应链","def":"绿色供应链；环保可持续供应链"},
  {"en":"Gross Merchandise Value (GMV)","zh":"商品交易总额","def":"商品交易总额；平台成交总额"},
  {"en":"Gross Register Tonnage (GRT)","zh":"总登记吨","def":"总登记吨；船舶容积登记吨"},
  {"en":"Gross Weight","zh":"毛重","def":"毛重；货物加包装总重量"},
  {"en":"Hague Rules","zh":"海牙规则","def":"海牙规则；统一提单责任的国际公约"},
  {"en":"Handling Costs","zh":"操作费","def":"转移、准备以及承包库存的相关成本。"},
  {"en":"Hangertainer","zh":"挂衣箱","def":"配备衣架横梁的专业集装箱，便于将衣物挂在衣架上。"},
  {"en":"Harmless Chemicals","zh":"无害化学品","def":"一种与条款相矛盾的货物品名。化学物是一种物质，其有害与否取决于其所处的环境或使用环境。"},
  {"en":"Harmonized System (HS)","zh":"协调制度（HS编码）","def":"协调制度；国际商品编码体系"},
  {"en":"Harmonized Tariff System (HTS)","zh":"协调关税制度","def":"协调关税制；基于HS的税则"},
  {"en":"Haulage","zh":"拖运","def":"拖运；陆路运输段"},
  {"en":"Hazardous or Dangerous Cargo","zh":"危险货物","def":"危险货物；具危害性的货物"},
  {"en":"Heavy Lift Charge","zh":"重件附加费","def":"超重附加费；超尺寸重货附加费"},
  {"en":"High Cube Non-Functioning reefer container (HNOR)","zh":"高箱非运营冷藏箱","def":"非营运高箱；不制冷的高柜"},
  {"en":"High-cube (HC)","zh":"高箱（HC）","def":"高箱；比普箱高的集装箱"},
  {"en":"Hitchment","zh":"拼装（混合装载）","def":"捎带货；搭便车运输的货物"},
  {"en":"Holds","zh":"货舱","def":"货舱；船内装货空间"},
  {"en":"Horizontal Integration","zh":"横向一体化","def":"横向一体化；同行业并购扩张"},
  {"en":"House B/L / House Airway Bill","zh":"分提单／分运单","def":"分单；货代签发给发货人的单"},
  {"en":"Hub","zh":"枢纽港","def":"枢纽；中转集散中心"},
  {"en":"Hustler","zh":"拖船（俚语）","def":"拖缆小艇；协助大船靠离的小船"},
  {"en":"IMCO Classification","zh":"国际海事分类","def":"国际海事控制组织对危险货物的分类。"},
  {"en":"IMDG","zh":"国际海运危险货物规则（IMDG）","def":"国际海运危险货物规则；危险品运输规则"},
  {"en":"Import Cargo Manifest (ICM )","zh":"进口载货清单","def":"进口载货清单；进口舱单"},
  {"en":"Import Duty","zh":"进口关税","def":"进口关税；进口应纳税"},
  {"en":"Import License","zh":"进口许可证","def":"进口许可证；准许进口的证件"},
  {"en":"Importer Security Filing (ISF)","zh":"进口商安全申报（ISF）","def":"进口安全申报；美进口预申报"},
  {"en":"Imports","zh":"进口","def":"一个国家的居民从另一国家购入或转移至自己国家的商品或服务。"},
  {"en":"Inbound","zh":"进港／ inbound","def":"进口货物运输。"},
  {"en":"Incoterms® (INCOTERMS)","zh":"国际贸易术语（Incoterms）","def":"是国际商会 (ICC) 最新拟定的标准贸易定义，通常称为 INCO 术语。这些术语包含 13 条国际贸易的基本规则，定义了买卖双方在国际销售合约中承担的最重要的责任。Incoterms 是销售合约的基本依据，也是全球海关当局和法院公认的国际标准。Incoterms 是国际商会的注册产品，自 1936 年首次发布以来已经过六次更新。详情请见：www.iccwbo.org"},
  {"en":"Independent Action (IA)","zh":"独立行动（公会成员单独行动）","def":"公会协定组织的个人成员为变更公会协议中规定的运输费率或条款而采取的独立行动。"},
  {"en":"Independent Carrier","zh":"独立承运人","def":"不是航运公会成员的承运商。"},
  {"en":"Inflation","zh":"通胀","def":"通胀；物价普遍上涨"},
  {"en":"Inland Carrier","zh":"内陆承运人","def":"在港口和内陆城市间进行进出口运输的运输公司。"},
  {"en":"Inspection certificate","zh":"检验证书","def":"检验证书；货物品质检验证明"},
  {"en":"Insurance Certificate","zh":"保险证书","def":"在货物在运输途中遭受损失或损坏的情况下，可保证收货人获得保险赔偿的文件。由保险公司向托运人（或另一方）签发，证明货物运输已纳入海运保单的的凭证。"},
  {"en":"Integrated Carriers","zh":"综合承运人","def":"一并提供空运和陆运服务的承运商，或提供其他综合运输服务（如海运、铁运和货运）的承运商。通常情况下，他们每小时可处理成千上万个小包裹。"},
  {"en":"Inter Company Billing (ICB)","zh":"公司间结算","def":"公司间结算；关联企业间 billing"},
  {"en":"Interational Federation of Freight Forwarders Associations (FIATA)","zh":"国际货运代理协会联合会","def":"国际货运代理协会联合会"},
  {"en":"Intermodal","zh":"多式联运","def":"由货运代理、背负式运输、集装箱运输、航空运输、装配运输、铁路运输和公路运输随意组合而成的联合货物运输，特别是在路程相当长的情况下。"},
  {"en":"Intermodal Marketing Company (IMC)","zh":"多式联运营销公司","def":"整合多个托运人的集装箱装载或背负式拖车运输，并与铁路部门协商大量货运空间。"},
  {"en":"Intermodal Transport","zh":"多式联运","def":"多式联运；多种运输方式衔接"},
  {"en":"International Air Transport Association (IATA)","zh":"国际航空运输协会","def":"国际航空运输协会"},
  {"en":"International Federation of Freight Forwarders (FIATA)","zh":"国际货运代理联合会","def":"国际货运代理联盟（同FIATA）"},
  {"en":"International Freight Forwarders","zh":"国际货运代理","def":"处理与出口相关的订货工作、文书工作和整合工作的货运代理。"},
  {"en":"International Ship and Port Facility Security (ISPS)","zh":"国际船舶和港口设施保安规则","def":"国际船舶港口设施保安规则"},
  {"en":"Inventory","zh":"库存","def":"库存；储存待售的货物"},
  {"en":"Inventory Carrying Costs","zh":"存货持有成本","def":"一般来说，置存成本或持有成本是财务衡量指标，可计算所持库存货物的所有相关成本。其中包括存货、仓储、废弃、变质、损坏和劳动力方面的成本，以及保险和税收。"},
  {"en":"Inventory Turnover","zh":"库存周转","def":"销货成本与现有平均存货余额的比率。该比率用以衡量公司在一年内出售存货的次数。"},
  {"en":"Inventory Velocity","zh":"库存周转速度","def":"将产品从收货区运至装货区的速度。"},
  {"en":"Invoice","zh":"发票","def":"发票；收款计价凭证"},
  {"en":"IPI","zh":"内陆点联运（美国内陆）","def":"内陆城市联运。通过陆路将货物运出/运进内陆城市。另请参阅“微桥运输”(Micro Bridge)。"},
  {"en":"ISA","zh":"独立航运协议","def":"信息系统协议。海运承运商的领导组织，致力于为海运业开发、推广和实施电子商务解决方案。"},
  {"en":"IT","zh":"即运入关","def":"可使货物在保税状态下穿越船舶入关口，在从一处海关直达另一处海关的即运通关运输指定的目的地进行海关结关；例如，目的地为芝加哥的货物从洛杉矶进入美国，到达芝加哥后才进行海关检查。"},
  {"en":"ITIGG","zh":"国际油运组织（缩写）","def":"国际运输实施细则团队。ITIGG 是一个国际专家团队，致力于发展和实施 UN/EDIFACT 标准信息，以在运输行业中进行电子贸易。ITIGG 隶属 UN/EDIFACT 运输信息发展集团——D4 。ITIGG 负责提出建议，为软件开发商提供一系列简单、直接的工具，以帮助设计用于全球电子贸易的应用程序，并阐明关键 UN/EDIFACT 信息设计师的设计意图。"},
  {"en":"Joint Rate","zh":"联运费率","def":"单个关税里规定的从一运输线某点运送至另一运输线某点的运输费率。"},
  {"en":"Jones Act","zh":"琼斯法案（美国沿海运输法）","def":"年海运法第 27 章规定，所有美国港口间（包括波多黎各）的水运货物必须由美国制造的挂美国国旗并配有美国船员的船舶运输。"},
  {"en":"Journal of Commerce (JOC)","zh":"商业日报（航运媒体）","def":"商业日报》：一本贸易刊物。贸易运输杂志。"},
  {"en":"Just-In-Time (JIT)","zh":"准时制（JIT）","def":"如果使用这种库存控制方法，可以尽可能减少仓储甚至完全不需要仓储；集装箱就是可移动的仓库，并且必须“准时”到达，不能太早或太迟。"},
  {"en":"Knot","zh":"节（航速单位）","def":"轮船与航空器常用的速度计量单位；1 节 = 1 海里/小时，约合 1.852 公里/小时。"},
  {"en":"Label Cargo","zh":"标签货","def":"根据《国际危险货物海运规则》的规定，包括所有商品在内的货物必须有标签。"},
  {"en":"Lading","zh":"装载（货物）","def":"装载；装船的货物"},
  {"en":"Land Bridge","zh":"大陆桥","def":"通过船舶从国外运输，随后又通过陆运（铁路或卡车）运送至美国内陆目的地或其他地方的集装箱 。另请参阅 MLB。"},
  {"en":"Landed Cost","zh":"到岸成本（落地成本）","def":"落地成本；含运费税费到岸总成本"},
  {"en":"Last In First Out (LIFO)","zh":"后进先出","def":"后进先出；后入库先出库"},
  {"en":"Less Than Container Load (LCL)","zh":"拼箱（LCL）","def":"这是一个常见术语，用来指未装满整个集装箱的所有待运输货物。按每集装箱算，拼箱货物的海运费率通常比整箱货物的海运费率高。因此，将不同地方或托运人的多个拼箱货物组合成一整箱货物可以节约成本。"},
  {"en":"Less Than Trailer Load (LTL)","zh":"零担（不足整车）","def":"参阅“拼箱货”（LCL）。"},
  {"en":"Letter of Credit (LC)","zh":"信用证","def":"银行开具的协议书，证明国外买方已经建立以卖方为受益人的信用额度，并且承诺，只要出示与信用证条款一致的相关单据就会支付货款。(2) 由银行开具给客户的证明书，证明其中的记名人有权动用或凭其信用借用一定数额的款项。(3) 由银行开具给信用获得人的证书，授权其从开证银行或其本国银行获得一定金额的款项，并承诺接收汇票（如果按期发出）。亦称作商业信用证、保兑信用状或保兑信用证。信用证有多种形式，代表用于不同目的的不同担保，受限条件也不一样。"},
  {"en":"Letter of indemnity (LOI)","zh":"赔偿保证书（保函）","def":"赔偿保证书；损害赔偿的保函"},
  {"en":"Lift-on/lift-off (LoLo)","zh":"吊上吊下（LoLo）","def":"吊上吊下；靠起重装卸的船"},
  {"en":"Line Haul","zh":"干线运输","def":"船舶航线覆盖最长距离的航海部分，一般跨洋（例如：新加坡 - 洛杉矶）。"},
  {"en":"Liner In/Free Out (LIFO)","zh":"船方负担装／不负担卸","def":"船方管装不管卸（注意与库存LIFO缩写同名）"},
  {"en":"LNG Carrier","zh":"液化天然气船","def":"液化天然气船"},
  {"en":"Loading","zh":"装载","def":"装货；将货物装上运输工具"},
  {"en":"Localization","zh":"本土化","def":"本地化；适配当地语言习惯"},
  {"en":"Logistics","zh":"物流","def":"对整个供应链所有货运和信息的管理，从最初的原材料来源一直到成品的最终消费者，涵盖制造厂、组装和包装工厂、仓库、配送中心和零售店。"},
  {"en":"Longshoreman","zh":"码头工人","def":"也称装卸工人。装载和卸载船运货物的工人。专门协助船舶装载和卸载货物及进行其他码头活动的码头工作人员。"},
  {"en":"LT","zh":"提前期（Lead Time）","def":"英吨：1 英吨 = 2,240 磅"},
  {"en":"Main-line Operator (MLO)","zh":"干线承运人","def":"干线承运人；主航线船公司"},
  {"en":"Manifest","zh":"舱单","def":"相关地方政府（例如海关）所要求的船舶运载的所有货物的清单。与载货清单相同。"},
  {"en":"Marks and Numbers","zh":"唛头及编号","def":"是指包装上或包装的标识详细信息，或者是指包装上出现的实际标记。"},
  {"en":"Master B/L","zh":"主提单","def":"主提单；承运人签发给货代的总单"},
  {"en":"Material Safety Data Sheet (MSDS)","zh":"材料安全数据表","def":"化学品安全说明书；危险物安全数据"},
  {"en":"Materials Management","zh":"物料管理","def":"物料和产品从获取到生产的整个过程中的采购、运转和管理。"},
  {"en":"Merchant Haulage Service","zh":"货主拖运","def":"代表客户协调第三方提供物流服务（货方托运安排）的服务。这项服务应客户要求提供，承运商为货方拖运提单协调进行内陆运输。客户与拖运提供商签订合同。承运商可拒绝提供此服务。"},
  {"en":"Metric Ton (MT)","zh":"公吨","def":"公制吨。1 公制吨 = 2,204.62 磅或 35.314 立方英尺。"},
  {"en":"Milestone","zh":"里程碑","def":"里程碑；项目关键节点"},
  {"en":"Milk Run","zh":"循环取货（milk run）","def":"循环取货；定点巡回集货"},
  {"en":"Mixed Shipment","zh":"混合装运","def":"由关税里两项或两项以上税率项目描述并规定的产品组成的装运。"},
  {"en":"MLB","zh":"小陆桥（Mini Land Bridge）","def":"该缩写表示从国外通过船舶运输，随后又通过陆运（铁路或卡车）运送至美国内陆目的地或其他地方的小路桥集装箱 。另请参阅“路桥”。"},
  {"en":"Mother Vessel","zh":"母船（干线船）","def":"定期将集装箱从固定起运港运送至固定目的港/目的点的班轮航线的主要远洋船舶。"},
  {"en":"MSI Plessey","zh":"MSI Plessey码（条码）","def":"这种条形码长度可以变化，最大长度为 15 个数字。校验和生成基于校验和参数的值。下表显示校验和属性的值以及创建的校验和类型。设置，描述，0，一系数 10 校验和，1，二系数 10 校验和，2，一系数 11 校验和/一系数 10 校验和。"},
  {"en":"Multi Country Consolidation","zh":"多国集运","def":"多国集运；多国货物合并发运"},
  {"en":"Multimodal","zh":"多式联运（多模式）","def":"多式联运；多种运输方式组合"},
  {"en":"Near Sourcing","zh":"近岸采购","def":"近岸采购；就近来源采购"},
  {"en":"Negotiable Bill of Lading","zh":"可转让提单","def":"可以流通、从一个人转让或分配给另一个人的票据，可在有背书（作为订货人的法定文件）或无背书（作为持票人的法定文件）的情况下转让，以交换等值物品，由此将权利转让给受让人；只要受让人是未收到事先通知的善意持票人，那么受让人的权利不会因为票据前手的权利缺陷或瑕疵而受到损害，也不会因为前手针对彼此的个人辩护而受到损害；举例来说，支付给持票人或订货人的提货单、汇票、本票和支票是可流通票据；另外，在某些地区，有些其他法定文件也是可流通票据（比如债券和某些类型的股票），即：可流通文件/可流通证券。“可流通”用法类似于“可转让” - 另请参阅“流通性/可转让性”。"},
  {"en":"Negotiating Bank","zh":"议付行","def":"是指托运人议付单据或单据首次呈递的银行，通常位于起运地所在国家/地区。还常用于指通知行。"},
  {"en":"Nested","zh":"嵌套（包装嵌套）","def":"三种或三种以上同款但大小不同的产品或商品必须相套在一起，每一个稍小的货物都装套在稍大一点的货物中；三种或三种以上同款同规格产品必须件件相套，这样放在最上方的商品才不会高出下方商品超过商品高度的三分之一。嵌套固体：三个或三个以上产品必须相套或相叠，这样放在上方的商品的外部侧面才能够跟下方产品的内部侧面紧紧相贴，并且放在上方的商品不会高出下方商品超过二分之一英寸。"},
  {"en":"Net Promoter Score (NPS)","zh":"净推荐值","def":"净推荐值；客户忠诚度指标"},
  {"en":"Net Weight","zh":"净重","def":"净重；货物本身重量"},
  {"en":"Neutral Body","zh":"中立机构","def":"由公会承运人指派的审查机构，用以确保所有法律规章都得以遵循。"},
  {"en":"Non-Asset-Based Third Party Providers","zh":"非资产型第三方供应商","def":"是指通常没有资产（运输和/或仓库设备）的第三方供应商。"},
  {"en":"Non-Negotiable Bill of Lading","zh":"不可转让提单","def":"一种作为收据和运输合同的证明的记名单据，不能作为货物所有权凭证，例如，货运单和某些行政管辖区（例如美国）内存在的记名提单。"},
  {"en":"Non-Vessel Operating Common Carrier (NVOCC)","zh":"无船承运人（NVOCC）","def":"无船承运商 - 在自己的费率框架内使用履行承运商提供国际货运服务的承运商，其费率体系以华盛顿联邦海事委员会规定的关税为依据。"},
  {"en":"Noridsk Speditörsförbunds Allmänna Bestämmelser 2000 (NSAB)","zh":"北欧货运代理通用条款2000","def":"北欧货运代理通用条款2000"},
  {"en":"Not Otherwise Enumerated (NOE)","zh":"未另列明","def":"不另列举"},
  {"en":"Not Otherwise Stated (NOS)","zh":"未另说明","def":"不另说明。"},
  {"en":"Notify Party","zh":"通知人","def":"提单或运货单上注明的货物到达目的地后需被通知的公司/责任人。通知方可以不是收货人，但通常情况下都是货物的实际接收人。通知方在提单或运货单下不享有其他特殊权利（除了通知）。"},
  {"en":"Ocean Transport Intermediary (OTI)","zh":"海运中介","def":"海运中介；海运经纪/代理"},
  {"en":"On Deck Stowage","zh":"甲板装载","def":"存放在船舶甲板上的货物。"},
  {"en":"On-Carriage","zh":"续运（后续运输）","def":"从卸货码头到客户经营场址之间的内陆进口运输服务。这给客户提供了门到门运输的灵活服务。这项服务应客户要求提供，当承运商使用内陆运输将货物运送至内陆地区时，可使用这项服务。"},
  {"en":"On-Time Performance","zh":"准点率","def":"运输系统在规定偏差范围内严格遵守其公布的规定时间的时间比例。"},
  {"en":"Open Issues List (OIL)","zh":"未决问题清单","def":"未决事项清单；待办问题列表"},
  {"en":"Open Rates","zh":"开放费率","def":"为各个承运商设定的费率。运价本中列有这些费率，但可能会因承运商的不同而有所不同。"},
  {"en":"Operations Info Portal (OIP)","zh":"运营信息门户","def":"运营信息门户；运营查询平台"},
  {"en":"Order Cycle","zh":"订单周期","def":"包括从下单到收货所涉及的时间和过程。包括以下几个过程：订单协商、订单处理、货物运输。"},
  {"en":"Order Management System (OMS)","zh":"订单管理系统","def":"订单管理系统；处理订单的系统"},
  {"en":"Order Processing","zh":"订单处理","def":"订单处理；接收至履约的流程"},
  {"en":"Origin Charge Catalogue (OCC)","zh":"起运地费用目录","def":"起运地费用目录；始发港收费表"},
  {"en":"Origin Motor Terminal, Origin Rail Terminal, Destination Motor Terminal (OMT, ORT, DMT)","zh":"起运地汽车站／铁路站、目的地汽车站","def":"起运港码头汽车货运站、起运港码头铁路货运站、目的港码头汽车货运站。汽车/铁路承运商在起运地/目的地指定的位置，汽车承运商或其授权代理在此整合、保留或储存海运承运商的集装箱和底盘车；托运人和其代理的装货集装箱在此被接收；运往托运人和其代理的空集装箱在此发运。"},
  {"en":"Origin/Destination Booking Services (OBK/DBK)","zh":"起运／目的订舱服务","def":"起运/目的地订舱服务"},
  {"en":"Original Bill of Lading (OBL)","zh":"正本提单","def":"提单正本。另请参阅可流通提单。"},
  {"en":"Original Equipment Manufacturer (OEM)","zh":"原始设备制造商","def":"原始设备制造商；代工厂"},
  {"en":"Out of Gauge Service","zh":"超限服务","def":"这项服务用于处理和运输尺寸“超标”的货物。通过该服务，承运商不仅能运输在长度、宽度、高度和/或重量方面超过标准集装箱尺寸的货物，还能处理“集装箱化的货物”。运送尺寸超标的货物将产生该费用。"},
  {"en":"Out-of-Gauge Cargo (OOG )","zh":"超限货物","def":"超限货；超标准尺寸的货"},
  {"en":"Outbound","zh":"出港／ outbound","def":"出口货物。"},
  {"en":"Outport","zh":"外港（小港）","def":"费率适用但可能需收取额外外港附加费的目的港，基本港除外。"},
  {"en":"Outsource","zh":"外包","def":"雇佣第三方供应商来承担前期由内部执行的工作。"},
  {"en":"Over Landed","zh":"溢卸（多卸）","def":"货运量总计超过最初的运输量。(2) 在原卸货港之外的地点卸下的货物。"},
  {"en":"Overland Common Port (OCP)","zh":"内陆共同点（OCP）","def":"由为美国提供服务的航运公司、铁路承运商和卡车司机制定的特殊优惠率。西海岸的进出口交通通过均衡来往其他沿海地区的运费费率，为中西部公司提供可与之匹配的选择，力求为中西部托运人和进口商创造利益。船舶公司降低其费率，由内陆承运商承担码头费用，其中包括处理费用、码头费和为汽车装卸货物的费用。OCP 费率适用于从以下各州发出或运往以下各州的货物：北达科他州、南达科他州、内布拉斯加州、科罗拉多州、新墨西哥州以及所有位于东部的州。在加拿大，OCP 费率适用于以下省份：曼尼托巴省、安大略省和魁北克省。"},
  {"en":"Packing List","zh":"装箱单","def":"每次运送的包装情况列表，详细说明重量/尺寸和数量。"},
  {"en":"Pallet","zh":"托盘","def":"用于通过叉车支撑货物和进行简便移动的木质结构。"},
  {"en":"Partlow Chart","zh":"温度记录图（Partlow）","def":"显示冷藏集装箱温度读数的图表。"},
  {"en":"Partnerships and Alliances","zh":"合伙与联盟","def":"签订的协议可使托运人和供应商双方受益。"},
  {"en":"Per Diem","zh":"每日费用（箱租）","def":"每天进行。"},
  {"en":"Physical Distribution","zh":"实物配送","def":"从生产线到最终用户的所有物流活动，包括交通、包装、材料处理、仓储、订单录入、客户服务、库存控制等等。"},
  {"en":"Pick & Pack","zh":"拣选与包装","def":"拣货包装；按单拣选并打包"},
  {"en":"Pier","zh":"突堤码头/栈桥","def":"远离陆地且延伸至水面一段距离的建筑，常用于停靠船只。也可称为“码头”。"},
  {"en":"Piggyback","zh":"背负式运输","def":"在经过特殊装配的铁路平板车上运输公路拖车或可拆卸拖车。"},
  {"en":"Pilferage","zh":"偷窃（小偷小摸）","def":"集装箱、仓库或码头的货物偷盗。"},
  {"en":"Plimsoll Mark","zh":"载重线标志（Plimsoll线）","def":"船舶安全负载所达到的深度。可通过船身外侧的圆圈来确定；该圆圈由一条竖直线贯穿，水平方向上有许多细小的画线，可显示出夏季和冬季的最大深度。"},
  {"en":"Point of Sale (POS)","zh":"销售点","def":"销售点；收银终端"},
  {"en":"Port & Terminal Service Charge [PTSC]","zh":"港口与码头服务费","def":"港口码头服务费"},
  {"en":"Port of Discharge (POD)","zh":"卸货港","def":"卸货港；货物卸下港"},
  {"en":"Port of Loading (POL)","zh":"装货港","def":"装货港；货物装船港"},
  {"en":"Positioning","zh":"调箱（箱位调度）","def":"将空设备从过剩地区转移至缺乏地区的操作。"},
  {"en":"Post Implementation Review (PIR)","zh":"实施后评审","def":"实施后评审；项目复盘"},
  {"en":"POSTNET","zh":"邮政条码","def":"条码主要用于在美国发送的信封或明信片。邮政服务。该条码位于信封的右下角。"},
  {"en":"Pre-Carriage (PRE - CARRIAGE)","zh":"前程运输","def":"从客户经营场址到装货港的内陆出口运输服务。这给客户提供了门到门运输的灵活服务。这项服务应客户要求提供，当承运商从要求的内陆地区进行内陆运输时，可使用这项服务。"},
  {"en":"Pre-Trip Inspection Service","zh":"预冷检查（冷藏箱）","def":"这项服务由承运商安排，让技术人员对温控集装箱进行一次额外检查，确保设备运行正常并能在规定的温度设置下运送货物。这项检查在放行空集装箱前进行。这项服务应客户要求提供，和/或在具有强制要求的地区针对特定类型的商品提供，确保货物可以正常运输。"},
  {"en":"Pricing and Quoting (PNQ)","zh":"定价与报价","def":"定价与报价；运价制定报价"},
  {"en":"Primage","zh":"保费（额外运费）","def":"运费补差；运费不足的追加"},
  {"en":"Proforma","zh":"形式发票","def":"形式发票；报价用临时发票"},
  {"en":"Proof Of Delivery (POD)","zh":"交货证明","def":"交货证明；收货确认凭证"},
  {"en":"Protection & Indemnity (P&I )","zh":"保赔（船东保赔协会）","def":"保赔协会；船东责任互助保险"},
  {"en":"Protection and Indemnity Insurance (P&I)","zh":"保赔保险","def":"保赔保险（同P&I）"},
  {"en":"Pull Strategy","zh":"拉动策略","def":"拉动策略；按需求拉动生产"},
  {"en":"Purchase Order","zh":"采购订单","def":"商品/服务订单的常见分组。多个 SKU 类别可能会列在一份订单中。大多数客户采用特定方式对其订单进行分组，以便在另一端进行配送。例如，服装进口商的一份订单中可能包含 24 件绿色毛衣和 24 件红色毛衣。如果多个订单 (P.O.) 来自同一商店，则此商店可轻松地将所有物品列在该 P.O. 中，并装运到正确的货车上。"},
  {"en":"Push Strategy","zh":"推动策略","def":"推动策略；提前铺货推动销售"},
  {"en":"Quality Control","zh":"质量控制","def":"对人员、材料、计量和机器的组合进行系统性规划、衡量与控制，旨在生产出符合企业质量与盈利率的产品。"},
  {"en":"Quarterly Business Review (QBR)","zh":"季度业务回顾","def":"季度业务回顾；季度复盘"},
  {"en":"Quay","zh":"码头（顺岸码头）","def":"沿海岸而建，以供船只或船舶着陆、装货、卸货的直码头、码头，或其他建筑。"},
  {"en":"Quick Reference Guide (QRG)","zh":"快速参考指南","def":"快速参考指南；速查手册"},
  {"en":"Quick Response (QR)","zh":"快速响应","def":"由消费者驱动的补货系统，可使从生产线到收银台的所有分拨点之间都可以使用无纸化 (EDI) 系统获得优质产品和准确信息。经销商、承运商和供应商作为贸易合作伙伴，共同致力于改善总体供应系统。"},
  {"en":"Quitclaim","zh":"放弃索赔（弃权书）","def":"在不提供担保或权利担保的情况下，用于解除某人的权利、所有权、权益并将其赋予他人的法律文书。"},
  {"en":"Railhead","zh":"铁路端点","def":"在铁路场站装载和卸载集装箱的地点。"},
  {"en":"Rate Agreement","zh":"费率协议","def":"讨论费率和常见问题并提出独立关税的承运商群体。"},
  {"en":"Re-engineering","zh":"流程再造","def":"通过重新创造、评估、设计和实施来改善业务操作的方法。"},
  {"en":"Received for Shipment Bill of Lading","zh":"收货待运提单","def":"如果还未确定要在船舶或其他运输工具装载被要求的货物，则可在承运商实际接受或代为保管货物时生成。当在船舶或其他运输工具正式装载货物时，该提单表格通常会更改为装船提单或作为装船批注添加。"},
  {"en":"Reefer","zh":"冷藏箱（冷藏集装箱）","def":"冷藏箱；制冷集装箱"},
  {"en":"Register Ton","zh":"登记吨","def":"表示船只内部容量的单位。1 登记吨 = 100 立方英尺或 2,832 立方米。也称为船舶吨。"},
  {"en":"Relay","zh":"接力（中转）","def":"在抵达中转港后被运往最终目的港的海运货物。"},
  {"en":"Release","zh":"放行","def":"放单；放货或放箱"},
  {"en":"Replenishment","zh":"补货","def":"将某物品的库存从备用仓库转移至主要拣货地点或进行拣货的其他储存模式的过程。"},
  {"en":"Request For Quote/Information/Price (RFQ/RFI/RFP)","zh":"询价／问询／招标","def":"询价/问讯/提案邀请"},
  {"en":"Restow","zh":"翻舱（重装）","def":"倒箱；为卸货重码箱位"},
  {"en":"Return Cargo","zh":"回程货","def":"退回至原收货地的货物。"},
  {"en":"Revenue Ton","zh":"计费吨","def":"按每吨计算运费的吨数。"},
  {"en":"Reverse Logistics","zh":"逆向物流","def":"逆向物流是较为通用的术语。广义上来说，逆向物流表示与重新使用产品和材料相关的所有操作。对这些操作的管理被称为“产品回收管理” (PRM)。PRM 关注如何处理已使用过的产品和材料。在某种程度上，部分该类活动类似于因不可靠的生产过程而造成的在内部回收次品的活动。逆向物流指收集、分解和处理已使用过的产品、产品部件和/或材料，以确保可持续（环保型）回收的所有物流活动。"},
  {"en":"Ro-Ro","zh":"滚装（滚装船）","def":"滚装船 - 用于承载汽车和轻型卡车的船舶。与使用起重机或其他外部设备装载货物不同，在该类船舶上，装货车辆可开上开下。"},
  {"en":"Roll-on/Roll-off (RoRo)","zh":"滚装","def":"滚装；车辆自行驶上驶下"},
  {"en":"Safety Of Life At Sea (SOLAS)","zh":"国际海上人命安全公约","def":"国际海上人命安全公约"},
  {"en":"Safety Stock","zh":"安全库存","def":"安全库存；应对波动的缓冲库存"},
  {"en":"Seals","zh":"封条","def":"封条；集装箱封志"},
  {"en":"Seawaybill","zh":"海运单","def":"用于港口到港口或联合型交通运输的提单类型。运货单与可流通提单相同，除非该运货单不是所有权凭证。这类单据没有签发原件。在美国等管辖区，运货单被视为委托（直接）提单的等效物。"},
  {"en":"Sell-Through","zh":"售罄率","def":"售罄率；售出占进货比"},
  {"en":"Service Agreement","zh":"服务协议","def":"由一个或多个承运人和一个或多个托运人签订的私人合同，双方必须按照已达成一致并且在该合同中列明的运输条款和条件在指定地点间运输货物。它通常允许对指定时间段内的数量征收特定税率。通常也称为服务合约。"},
  {"en":"Service Level agreement (SLA)","zh":"服务等级协议","def":"服务水平协议；服务达标约定"},
  {"en":"Set Point","zh":"设定点（温度）","def":"冷藏集装箱设定并保持的特定温度。理想状态下，设定的温度与实际温度在整个航次中应该相同。"},
  {"en":"Shanghai Shipping Exchange (SSE)","zh":"上海航运交易所","def":"上海航运交易所"},
  {"en":"Ship's Chandlers","zh":"船用物料商","def":"为船舶提供不同项目的供应商。"},
  {"en":"Shipment","zh":"装运/货物","def":"shipment；一批运输的货物"},
  {"en":"Shipment Window","zh":"装运窗口","def":"装运窗口；允许装运的时间段"},
  {"en":"Shipped On Board (SOB )","zh":"已装船","def":"已装船；货物装上船的批注"},
  {"en":"Shipper","zh":"托运人","def":"托运货物（如单独装船的货物）的人。2) 提单或运单上指名为托运人的法定实体或个人，和/或与承运人（或以其名义或代表其与承运人）签订运输合同的人。也称委托人。"},
  {"en":"Shipper Packed","zh":"托运人装箱","def":"为托运人或由托运人装载（装箱）、堆装（包装/支撑）、称重和/或计数的集装箱内容，通常为 堆场装货。"},
  {"en":"Shippers Export Declaration","zh":"托运人出口申报","def":"托运人出口申报；出口申报单"},
  {"en":"Shipping Instruction (SI)","zh":"装船指示","def":"装运指示；发货人给承运人的指令"},
  {"en":"Shipping Order","zh":"装货单","def":"证明运输货物协议的预订等效物和运输合同。"},
  {"en":"Short Landed","zh":"短卸（少卸）","def":"货物量（在交付目的地）少于最初装船时的数量。"},
  {"en":"Short Shipped","zh":"短装","def":"货物错过了原计划用于装载的船舶。"},
  {"en":"Shunting","zh":"调轨（调车）","def":"调车；铁路车辆编组调动"},
  {"en":"Slot Charter","zh":"舱位租赁","def":"承运商为其他承运商的船舶提供的箱位/空间租赁。"},
  {"en":"SMDG","zh":"船图数据标准（SMDG）","def":"航运公司和集装箱码头的用户组。全球航运企业集团发展及推广海运业的 UN/EDIFACT EDI 标准，是由 UN/EDIFACT 董事会认可的泛欧洲官方用户组。"},
  {"en":"Special Customs Invoice","zh":"特别海关发票","def":"当关税税率基于货物价值且该价值超过 500 美元时，美国海关通常会要求填写的正式表格。通常由外国出口商或其货代准备、并由海关用于决定所运货物价值的文件。出口商或其代理人必须证明所提供数据的真实性。"},
  {"en":"Special Rate","zh":"特殊费率","def":"针对特定商品制定的在特定时间段内收取的税率。"},
  {"en":"SS","zh":"汽船（Steamship）","def":"轮船。"},
  {"en":"ST","zh":"短吨（Short Ton）","def":"短吨 = 2 000 磅。"},
  {"en":"Standard Carrier Alpha Code (SCAC)","zh":"标准承运人代码","def":"承运人标准代码；美承运商代码"},
  {"en":"Standard Trading Terms & Conditions (STC)","zh":"标准交易条款","def":"标准贸易条款；通用交易条件"},
  {"en":"STC","zh":"标准交易条款（said to contain 据称装有）","def":"据称内装”的缩写。"},
  {"en":"Stern","zh":"船尾","def":"船尾；船舶后端"},
  {"en":"Stevedore","zh":"装卸工（码头工人）","def":"为协助装载和卸载船舶并参与各种码头活动的而指派的码头操作人员。也称码头装卸工人。"},
  {"en":"Stock Keeping Unit (SKU)","zh":"库存单位","def":"货物的最小分组单元，通常表示单个零售项目。通常，一份采购订单将包含多个 SKU。"},
  {"en":"Storage Charge","zh":"仓储费","def":"货物在一段时间内根据特定协议放置在仓储设施（仓库）产生的费用，不包含在其他安排中。"},
  {"en":"Store-Door Delivery","zh":"门到门送货","def":"从卸货码头到客户经营场址之间的内陆进口运输服务。这给客户提供了门到门运输的灵活服务。这项服务应客户要求提供，当承运商使用内陆运输将货物运送至内陆地区时，可使用这项服务。"},
  {"en":"Stripping","zh":"拆箱","def":"承运商在港口区域为客户提供的拆箱（卸货）或装箱（装货）服务。该服务应客户要求提供。"},
  {"en":"Stuffing","zh":"装箱","def":"承运商在港口区域为客户提供的拆箱（卸货）或装箱（装货）服务。该服务应客户要求提供。"},
  {"en":"Sulphur Emissions Control Areas (SECA)","zh":"硫排放控制区","def":"硫排放控制区；限硫海域"},
  {"en":"Supply Chain","zh":"供应链","def":"在从获取原材料到交付给最终用户的整个物流过程中对材料和信息的转移。供应链包括所有供应商、服务供应商和客户。"},
  {"en":"Supply Chain Development (SCD)","zh":"供应链发展","def":"供应链发展；供应链优化建设"},
  {"en":"Supply Chain Management","zh":"供应链管理","def":"在从原料收购到交付给最终用户的物流过程中对所有材料和信息的管理和控制。"},
  {"en":"Surcharges","zh":"附加费","def":"除海运运费之外的附加费用。另请参阅“附加费”。"},

  {"en":"Yaw","zh":"偏航","def":"偏摇；船首左右摆动"},
  {"en":"Yawl","zh":"小帆船（艉舵艇）","def":"小帆船；船尾斜桅小艇"},
  {"en":"Year on Year (YoY)","zh":"同比","def":"同比；与去年同期比"},
  {"en":"Year To Date (YTD)","zh":"年初至今","def":"年初至今。"},
  {"en":"Yield","zh":"收益/产出","def":"收益；单位运力收入"},
  {"en":"Yield Bucket","zh":"收益桶（收益分组）","def":"收益分组；按收益分级管理"},
  {"en":"Yield Management","zh":"收益管理","def":"收益管理；动态定价增收"},
  {"en":"York-Antwerp Rules","zh":"约克-安特卫普规则（共同海损）","def":"约克-安特卫普规则；共同海损理算规则"},
  {"en":"Zone Haulage Rate","zh":"区域拖运费","def":"区域拖运费；按区计拖运费率"}
];;
    var listEl = document.getElementById('list');
    var cntEl = document.getElementById('cnt');
    var qEl = document.getElementById('q');
    var alphaEl = document.getElementById('alpha');

    // derive a letter key from the English term (A-Z, or # for digits/others)
    function letterOf(en){
      var c = (en || '').charAt(0).toUpperCase();
      return /[A-Z]/.test(c) ? c : '#';
    }
    // group entries by letter, preserving GLOSSARY order
    var groups = {};
    var order = [];
    GLOSSARY.forEach(function(d){
      var L = letterOf(d.en);
      if (!groups[L]) { groups[L] = []; order.push(L); }
      groups[L].push(d);
    });
    var ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    function esc(s){ return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function hl(text, q){
      text = text || '';
      if (!q) return esc(text);
      var i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) return esc(text);
      return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
    }
    function card(d, q){
      return '<div class="g-item">'
        + '<div class="g-en">' + hl(d.en, q) + '</div>'
        + '<div class="g-zh">' + hl(d.zh, q) + '</div>'
        + '<div class="g-def">' + hl(d.def, q) + '</div>'
        + '</div>';
    }

    // render the full grouped A-Z list (also applies live search filter)
    function renderAll(q){
      q = (q || '').trim().toLowerCase();
      var html = '';
      var total = 0;
      ALPHA.concat('#').forEach(function(L){
        if (!groups[L] || !groups[L].length) return;
        var items = groups[L].filter(function(d){
          if (!q) return true;
          return (d.en + ' ' + d.zh + ' ' + d.def).toLowerCase().indexOf(q) >= 0;
        });
        if (!items.length) return;
        total += items.length;
        html += '<section class="g-section" id="sec-' + L + '">'
              + '<div class="g-letter">' + L + '</div>'
              + '<div class="g-grid">' + items.map(function(d){ return card(d, q); }).join('') + '</div>'
              + '</section>';
      });
      cntEl.textContent = total;
      listEl.innerHTML = total ? html : '<div class="g-empty">没有匹配的术语，换个关键词试试～</div>';
    }

    // build the clickable A-Z quick-jump index
    var btns = ['全部'].concat(ALPHA, '#');
    btns.forEach(function(L){
      var b = document.createElement('button');
      b.textContent = L;
      if (L === '全部') b.classList.add('active');
      if (L !== '全部' && (!groups[L] || !groups[L].length)) b.classList.add('disabled');
      b.addEventListener('click', function(){
        var active = alphaEl.querySelector('.active');
        if (active) active.classList.remove('active');
        b.classList.add('active');
        if (L === '全部'){
          listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          var sec = document.getElementById('sec-' + L);
          if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
      alphaEl.appendChild(b);
    });

    qEl.addEventListener('input', function(){ renderAll(this.value); });
    renderAll('');
  </script>
</body>
